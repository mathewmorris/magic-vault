name: Card image embeddings
# Builds the AI scan index (CardEmbedding) for cards that don't have an
# embedding for the current model yet. Runs an hour after the Scryfall sync
# so new cards get picked up the same day. See docs/card-recognition.md.
#
# Off until the repo variable AI_SCAN_INDEX_ENABLED is set to "true"
# (Settings > Secrets and variables > Actions > Variables).
on:
  schedule:
    # 10:17 UTC daily, an hour after scryfall-sync.yml (09:17).
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Most cards to embed this run"
        type: number
        default: 20000
      calibrate:
        description: "Run the calibration report instead of indexing (writes nothing)"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: count what needs embedding, write nothing"
        type: boolean
        default: false
      target:
        description: "Which database to index. preview is the Neon preview branch PR previews use (needs the PREVIEW_DATABASE_URL secret) and runs even while AI_SCAN_INDEX_ENABLED is off."
        type: choice
        options:
          - production
          - preview
        default: production

concurrency:
  group: card-embeddings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  embed:
    name: Embed card images
    if: vars.AI_SCAN_INDEX_ENABLED == 'true' || inputs.target == 'preview'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 300
    env:
      # A preview run never falls back to production: with no preview secret it gets "missing" and stops.
      DATABASE_URL: ${{ inputs.target == 'preview' && (secrets.PREVIEW_DATABASE_URL || 'missing') || secrets.DATABASE_URL }}
      SKIP_ENV_VALIDATION: "true"
      # Empty on scheduled runs, so those use the defaults below.
      LIMIT: ${{ inputs.limit }}
      CALIBRATE: ${{ inputs.calibrate }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check the preview secret
        if: inputs.target == 'preview' && env.DATABASE_URL == 'missing'
        run: |
          echo "Add the PREVIEW_DATABASE_URL secret (the Neon preview branch's connection string) to run with target preview."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # The model id names the file, so a new EMBED_MODEL.id gets a new cache.
      - name: Read model id
        id: model
        run: |
          id=$(node -e "require('ts-node').register({transpileOnly:true,compilerOptions:{module:'CommonJS'}}); console.log(require('./src/utils/recognition/model').EMBED_MODEL.id)")
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Cache model
        uses: actions/cache@v5
        with:
          path: .cache/models
          key: card-embed-model-${{ steps.model.outputs.id }}

      - name: Calibrate
        if: env.CALIBRATE == 'true'
        run: npm run embed:calibrate

      - name: Embed cards
        if: env.CALIBRATE != 'true'
        run: |
          args=(--limit "${LIMIT:-20000}")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          npm run embed:cards -- "${args[@]}"
