name: Scryfall card sync
# Keeps the Card table in the production database current with Scryfall's
# default_cards bulk file. Runs daily and does nothing when the bulk file
# hasn't changed since the last successful sync.
on:
  schedule:
    # 09:17 UTC daily (early morning in the US, off the top of the hour).
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show what would change, write nothing"
        type: boolean
        default: true
      full:
        description: "Ignore saved state and upsert every card"
        type: boolean
        default: false

concurrency:
  group: scryfall-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync Card table from Scryfall bulk data
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scryfall-data-broker
    env:
      # Empty on scheduled runs, so those are never dry runs.
      DRY_RUN: ${{ inputs.dry_run }}
      FULL: ${{ inputs.full }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scryfall-data-broker/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # state/ holds hashes.json (id -> hash of the stored columns) and
      # state.json (bulk updated_at of the last successful sync).
      - name: Restore sync state
        uses: actions/cache/restore@v4
        with:
          path: scryfall-data-broker/state
          key: scryfall-sync-state-${{ github.run_id }}
          restore-keys: scryfall-sync-state-

      - name: Check for a new bulk file
        id: check
        run: |
          if [ "$FULL" = "true" ]; then
            python sync.py check --state-dir state --force
          else
            python sync.py check --state-dir state
          fi

      - name: Download bulk file
        if: steps.check.outputs.changed == 'true'
        env:
          DOWNLOAD_URI: ${{ steps.check.outputs.download_uri }}
        run: python sync.py download "$DOWNLOAD_URI" --out default_cards.json

      - name: Apply new and changed cards
        if: steps.check.outputs.changed == 'true'
        env:
          UPDATED_AT: ${{ steps.check.outputs.updated_at }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          args=(apply default_cards.json --state-dir state --updated-at "$UPDATED_AT")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$FULL" = "true" ]; then args+=(--full); fi
          python sync.py "${args[@]}"

      # Only after a real, successful write, so a failed or dry run leaves
      # the next run to pick up the same changes.
      - name: Save sync state
        if: success() && steps.check.outputs.changed == 'true' && inputs.dry_run != true
        uses: actions/cache/save@v4
        with:
          path: scryfall-data-broker/state
          key: scryfall-sync-state-${{ github.run_id }}
