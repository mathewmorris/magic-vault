name: CI
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/magicvault"
      NEXTAUTH_SECRET: "ci"
      NEXTAUTH_URL: "http://localhost:3000"
      DISCORD_CLIENT_ID: "ci"
      DISCORD_CLIENT_SECRET: "ci"
      GITHUB_ID: "ci"
      GITHUB_SECRET: "ci"
      GOOGLE_ID: "ci"
      GOOGLE_SECRET: "ci"
      EMAIL_SERVER: "smtp://localhost:1025"
      EMAIL_FROM: "noreply@magicvault.local"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector for the CardEmbedding migration (CREATE EXTENSION vector).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magicvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/magicvault_test"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Integration tests
        run: npm run test:integration -- --ci

  broker:
    name: Scryfall broker tests
    runs-on: ubuntu-latest
    # For tests/test_sync_postgres.py, which runs the sync against a real
    # database with the Prisma migrations applied.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: broker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # On a PR, HEAD is the merge commit and HEAD^1 is the base branch.
      - name: Check for broker changes
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || \
             git diff --name-only HEAD^1 HEAD | grep -qE '^(scryfall-data-broker/|\.github/workflows/(ci|scryfall-sync)\.yml$)'; then
            echo "broker=true" >> "$GITHUB_OUTPUT"
          else
            echo "No broker changes, skipping."
          fi

      - uses: actions/setup-python@v6
        if: steps.changes.outputs.broker == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scryfall-data-broker/requirements.txt

      - name: Install
        if: steps.changes.outputs.broker == 'true'
        working-directory: scryfall-data-broker
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.broker == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Apply migrations to the test database
        if: steps.changes.outputs.broker == 'true'
        run: |
          npm ci
          npx prisma migrate deploy
        env:
          SKIP_ENV_VALIDATION: "true"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/broker_test"

      - name: Unit tests
        if: steps.changes.outputs.broker == 'true'
        working-directory: scryfall-data-broker
        run: python -m unittest -v
        env:
          BROKER_TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/broker_test"

  scan-browser:
    # Mat's rule: check /scan in a real browser before calling a preview ready.
    # Builds the app with the AI scanner on, signs in as test users, points a
    # fake camera at a real card and checks it loads, plays and adds the card.
    name: Scanner in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magicvault_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/magicvault_e2e"
      NEXTAUTH_SECRET: "ci"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_FEATURE_AI_SCAN: "true"
      NEXT_PUBLIC_FEATURE_AI_SCAN_DEBUG: "true"
      # Turns on the test-user sign-in (src/server/previewLogin/enabled.ts).
      VERCEL_ENV: "preview"
      E2E_FAKE_CAMERA: ${{ github.workspace }}/e2e-out/card.y4m
      E2E_SCAN_TARGET: ${{ github.workspace }}/e2e-out/target.json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
          command -v ffmpeg || sudo apt-get install -y ffmpeg

      - name: Database and a card to scan
        run: |
          npx prisma migrate deploy
          node e2e/scan/seed-cards.mjs e2e-out
          # The card on a dark table, like a phone camera would see it.
          ffmpeg -loglevel error -loop 1 -i e2e-out/card.png \
            -vf "scale=-2:600,pad=1280:720:(ow-iw)/2:(oh-ih)/2:color=0x2a2a2a,format=yuv420p" \
            -t 4 -r 15 e2e-out/card.y4m

      - name: Build
        run: npm run build

      - name: Scan in Chromium
        run: |
          npm run start > e2e-out/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000 && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3000 || { cat e2e-out/server.log; exit 1; }
          npx playwright test e2e/scan.spec.ts --reporter=list --retries=0

      - name: Server log
        if: failure()
        run: tail -n 200 e2e-out/server.log
